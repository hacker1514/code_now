<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="24" />

  <!-- Code Symbol <>_ -->
  <text x="256" y="315" 
        font-family="Consolas, Monaco, 'Courier New', monospace" 
        font-size="190" 
        font-weight="900" 
        fill="url(#textGrad)" 
        text-anchor="middle" 
        letter-spacing="-8">&lt;&gt;_</text>

  <!-- Pulse Status Indicator -->
  <circle cx="410" cy="102" r="22" fill="#34d399" />
  <circle cx="410" cy="102" r="30" fill="none" stroke="#34d399" stroke-width="6" opacity="0.6" />
</svg>